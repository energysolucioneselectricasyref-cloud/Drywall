<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Materiales - OSUL</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; color: #333; margin: 0; padding: 20px; background-color: #f9f9f9; }
        .invoice-box { max-width: 500px; margin: auto; padding: 25px; border: 1px solid #ddd; background-color: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
        .header-logo { text-align: center; margin-bottom: 25px; }
        .logo-placeholder { background-color: #000; color: #00e5ff; display: inline-block; padding: 15px 30px; border-radius: 50%; font-weight: bold; border: 3px double #00e5ff; text-shadow: 0 0 5px #00e5ff; box-shadow: inset 0 0 10px rgba(0,229,255,0.5); }
        .logo-placeholder h2 { margin: 0; font-size: 26px; letter-spacing: 2px; }
        .logo-placeholder p { margin: 0; font-size: 10px; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
        .project-info { font-size: 14px; line-height: 1.6; margin-bottom: 25px; border-bottom: 1px dashed #ccc; padding-bottom: 15px; }
        .project-info p { margin: 4px 0; }
        .section-title { text-align: center; font-size: 16px; font-weight: bold; margin: 20px 0 10px 0; text-transform: uppercase; letter-spacing: 1px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 12px; margin-bottom: 25px; }
        th { background-color: #f4f6f9; padding: 8px; border: 1px solid #ddd; font-weight: bold; text-transform: uppercase; }
        td { padding: 8px; border: 1px solid #ddd; vertical-align: middle; }
        .text-right { text-align: right; }
        .text-center { text-align: center; }
        .barcode-section { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 5px solid #000; }
        .barcode { font-family: 'Libre Barcode 39', 'Courier New', monospace; font-size: 42px; margin: 5px 0; display: block; letter-spacing: 2px; }
        .barcode-text { font-size: 14px; font-weight: bold; letter-spacing: 1px; }
        .no-print-zone { text-align: center; margin-bottom: 20px; }
        .btn-print { padding: 10px 20px; background: #000; color: #fff; border: 1px solid #00e5ff; border-radius: 4px; cursor: pointer; font-weight: bold; text-transform: uppercase; box-shadow: 0 0 5px rgba(0,229,255,0.3); }
        .btn-print:hover { background: #00e5ff; color: #000; }
        .loading { text-align: center; font-size: 16px; padding: 50px; color: #666; }
        @media print { body { background-color: #fff; padding: 0; } .invoice-box { box-shadow: none; border: none; padding: 0; max-width: 100%; } .no-print-zone { display: none; } }
    </style>
    <!-- Se incluye la fuente para el código de barras legible por fuentes estándar si no carga el lector -->
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

<div class="no-print-zone">
    <button class="btn-print" onclick="window.print()">Imprimir Factura</button>
</div>

<div id="loading" class="loading">Buscando registros en el sistema Drywall...</div>

<div id="invoice" class="invoice-box" style="display: none;">
    <div class="header-logo">
        <div class="logo-placeholder">
            <h2>OSUL</h2>
            <p>Instalación de Cielo Raso</p>
        </div>
    </div>

    <div class="project-info">
        <p><strong>• Cliente:</strong> <span id="inv-cliente"></span></p>
        <p><strong>• Proyecto:</strong> <span id="inv-nombre"></span></p>
        <p><strong>• Fecha:</strong> <span id="inv-fecha"></span></p>
        <p><strong>• Dimensiones:</strong> <span id="inv-largo"></span> m × <span id="inv-ancho"></span> m</p>
        <p><strong>• Área Total:</strong> <span id="inv-area"></span> m²</p>
    </div>

    <div class="section-title">Detalle Materiales</div>

    <table>
        <thead>
            <tr>
                <th>Material</th>
                <th class="text-center">Unidad</th>
                <th class="text-right">Cantidad Calculada</th>
                <th class="text-right">Costo Total</th>
            </tr>
        </thead>
        <tbody id="materiales-rows"></tbody>
    </table>

    <div class="barcode-section">
        <span class="barcode" id="visual-barcode"></span>
        <div class="barcode-text" id="inv-barcode-id">FAC-001</div>
    </div>
</div>

<script>
    const appId = "22eef414-0edc-4b1e-916a-ea9e07f970e2"; 

    const urlParams = new URLSearchParams(window.location.search);
    const idProyecto = urlParams.get('id');
    const accessKey = urlParams.get('key'); 

    if (!idProyecto) {
        document.getElementById('loading').innerText = "Error: Parámetro 'id' no detectado en la URL.";
    } else if (!accessKey) {
        document.getElementById('loading').innerText = "Error: Permiso de seguridad 'key' ausente.";
    } else {
        ejecutarCargaDeFactura(idProyecto);
    }

    async function ejecutarCargaDeFactura(id) {
        try {
            // Corregido el endpoint de AppSheet API estructurando la URL correctamente
            const baseUrl = `https://appsheet.com{appId}/tables`;

            // 1. Consulta Tabla Proyectos
            const proyResponse = await fetch(`${baseUrl}/Proyectos/Action`, {
                method: 'POST',
                headers: { 'applicationAccessKey': accessKey, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    "Action": "Find",
                    "Properties": { "Locale": "es-ES" },
                    "Rows": [ { "ID_Proyecto": id } ]
                })
            });
            const proyData = await proyResponse.json();

            if (!proyData || !Array.isArray(proyData) || proyData.length === 0) {
                document.getElementById('loading').innerText = "No se encontró ningún proyecto con el ID especificado.";
                return;
            }
            
            const proyecto = proyData[0]; 

            // 2. Consulta Tabla Detalle_Materiales
            const matResponse = await fetch(`${baseUrl}/Detalle_Materiales/Action`, {
                method: 'POST',
                headers: { 'applicationAccessKey': accessKey, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    "Action": "Find",
                    "Properties": { "Locale": "es-ES" },
                    "Rows": []
                })
            });
            const matData = await matResponse.json();

            let materialesFiltrados = [];
            if (matData && Array.isArray(matData)) {
                materialesFiltrados = matData.filter(item => String(item.ID_Proyecto).trim() === String(id).trim());
            }

            // 3. Inyectar datos generales en los elementos HTML
            document.getElementById('inv-cliente').innerText = proyecto.Cliente || 'N/A';
            document.getElementById('inv-nombre').innerText = proyecto.Nombre_Proyecto || 'N/A';
            document.getElementById('inv-fecha').innerText = proyecto.Fecha || 'N/A';
            document.getElementById('inv-largo').innerText = proyecto.Largo_m || '0.00';
            document.getElementById('inv-ancho').innerText = proyecto.Ancho_m || '0.00';
            document.getElementById('inv-area').innerText = proyecto.Area_Total || '0.00';
            
            const txtID = proyecto.ID_Proyecto || id;
            document.getElementById('inv-barcode-id').innerText = txtID;
            
            // Requerimiento del formato Libre Barcode 39 (requiere asteriscos como delimitadores de inicio/fin)
            document.getElementById('visual-barcode').innerText = `*${txtID}*`;

            // 4. Inyectar filas de materiales corregido y completado sin truncar
            const tbody = document.getElementById('materiales-rows');
            tbody.innerHTML = "";

            if (materialesFiltrados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center" style="color: #999;">No hay materiales calculados registrados para este proyecto.</td></tr>`;
            } else {
                materialesFiltrados.forEach(mat => {
                    const tr = document.createElement('tr');
                    const nombreMaterial = mat.ID_Material || mat.Material || 'Insumo';
                    const unidad = mat.Unidad || 'Unidad';
                    const cantidad = parseFloat(mat.Cantidad_Calculada || 0).toFixed(2);
                    const costo = mat.Costo_Total ? `$${parseFloat(mat.Costo_Total).toLocaleString('es-CO', {minimumFractionDigits: 2})}` : '$0.00';

                    tr.innerHTML = `
                        <td>${nombreMaterial}</td>
                        <td class="text-center">${unidad}</td>
                        <td class="text-right">${cantidad}</td>
                        <td class="text-right">${costo}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // Ocultar cargador y mostrar la factura renderizada
            document.getElementById('loading').style.display = 'none';
            document.getElementById('invoice').style.display = 'block';

        } catch (error) {
            console.error(error);
            document.getElementById('loading').innerText = "Error crítico al comunicar con la base de datos de AppSheet.";
        }
    }
</script>
</body>
</html>
