<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Materiales - OSUL</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; color: #333; margin: 0; padding: 20px; background-color: #f9f9f9; }
        .invoice-box { max-width: 600px; margin: auto; padding: 25px; border: 1px solid #ddd; background-color: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
        .header-logo { text-align: center; margin-bottom: 25px; }
        .logo-img { max-width: 200px; height: auto; display: inline-block; }
        .project-info { font-size: 14px; line-height: 1.6; margin-bottom: 25px; border-bottom: 1px dashed #ccc; padding-bottom: 15px; }
        .project-info p { margin: 4px 0; }
        .section-title { text-align: center; font-size: 18px; font-weight: bold; margin: 30px 0 15px 0; letter-spacing: 1px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 12px; margin-bottom: 25px; }
        th { background-color: #ffffff; padding: 10px; border: 1px solid #333; font-weight: bold; text-align: center; }
        td { padding: 8px; border: 1px solid #333; vertical-align: middle; }
        tr.total-row td { font-weight: bold; background-color: #ffffff; font-size: 13px; border-top: 2px solid #333; }
        .text-right { text-align: right; }
        .text-center { text-align: center; }
        .barcode-section { text-align: center; margin-top: 40px; padding-top: 20px; }
        .barcode-img { max-width: 250px; height: auto; margin: 5px 0; display: inline-block; }
        .barcode-text { font-size: 14px; font-weight: bold; letter-spacing: 1px; margin-top: 5px; }
        .no-print-zone { text-align: center; margin-bottom: 20px; }
        .btn-print { padding: 10px 20px; background: #000; color: #fff; border: 1px solid #00e5ff; border-radius: 4px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .btn-print:hover { background: #00e5ff; color: #000; }
        .loading { text-align: center; font-size: 16px; padding: 50px; color: #666; }
        @media print { body { background-color: #fff; padding: 0; } .invoice-box { box-shadow: none; border: none; padding: 0; max-width: 100%; } .no-print-zone { display: none; } }
    </style>
</head>
<body>

<div class="no-print-zone">
    <button class="btn-print" onclick="window.print()">Imprimir Factura</button>
</div>

<div id="loading" class="loading">Cargando datos del documento...</div>

<div id="invoice" class="invoice-box" style="display: none;">
    <!-- Encabezado con imagen de Logo OSUL -->
    <div class="header-logo">
        <img src="https://github.io" class="logo-img" alt="OSUL">
    </div>

    <!-- Datos del proyecto e información general -->
    <div class="project-info">
        <p><strong>• Cliente:</strong> <span id="inv-cliente"></span></p>
        <p><strong>• Proyecto:</strong> <span id="inv-nombre"></span></p>
        <p><strong>• Fecha:</strong> <span id="inv-fecha"></span></p>
        <p><strong>• Dimensiones:</strong> <span id="inv-largo"></span> m × <span id="inv-ancho"></span> m</p>
        <p><strong>• Área Total:</strong> <span id="inv-area"></span> m²</p>
    </div>

    <div class="section-title">Detalle Materiales</div>

    <!-- Tabla Estructurada -->
    <table>
        <thead>
            <tr>
                <th style="width: 45%;">Material</th>
                <th style="width: 15%;">Unidad</th>
                <th style="width: 20%;">Cantidad Calculada</th>
                <th style="width: 20%;">Costo Total</th>
            </tr>
        </thead>
        <tbody id="materiales-rows"></tbody>
        <tfoot>
            <tr class="total-row">
                <td colspan="3" class="text-right">TOTAL:</td>
                <td id="inv-total-general" class="text-right">$0.00</td>
            </tr>
        </tfoot>
    </table>

    <!-- Contenedor del Código de Barras -->
    <div class="bc-container" id="div-barcode" style="display:none;">
        <img id="img-barcode" src="" alt="Código de Barras">
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const boleta = urlParams.get('boleta');

    if (!boleta) {
        document.getElementById('loading').innerText = "Error: Parámetro 'boleta' (ID de proyecto) no detectado en la URL.";
    } else {
        generarFacturaDirecta();
    }

    function generarFacturaDirecta() {
        try {
            // 1. Cargar metadatos generales
            document.getElementById('inv-cliente').innerText = urlParams.get('mesa') || 'N/A';
            document.getElementById('inv-nombre').innerText = urlParams.get('tipo_doc') || 'Cielo raso en drywall';
            document.getElementById('inv-fecha').innerText = urlParams.get('fecha') || 'N/A';
            
            document.getElementById('inv-largo').innerText = urlParams.get('largo') || '4.00';
            document.getElementById('inv-ancho').innerText = urlParams.get('ancho') || '3.00';
            document.getElementById('inv-area').innerText = urlParams.get('area') || '12.00';
            
            document.getElementById('inv-barcode-id').innerText = boleta;

            // CORRECCIÓN CÓDIGO DE BARRAS: Endpoint oficial y uso correcto del template literal con "$"
            document.getElementById('barcode-container').innerHTML = `<img src="https://tec-it.com{encodeURIComponent(boleta)}&code=Code128" class="barcode-img" alt="Barcode">`;

            // 2. Descomponer las cadenas unidas por la barra vertical "|"
            const rawServicios = urlParams.get('servicios') || '';
            const rawCantidades = urlParams.get('cantidades') || '';
            const rawPrecios = urlParams.get('p_unit') || '';
            const rawUnidades = urlParams.get('unidades') || '';

            const listaServicios = rawServicios ? rawServicios.split('|') : [];
            const listaCantidades = rawCantidades ? rawCantidades.split('|') : [];
            const listaPrecios = rawPrecios ? rawPrecios.split('|') : [];
            const listaUnidades = rawUnidades ? rawUnidades.split('|') : [];

            const tbody = document.getElementById('materiales-rows');
            tbody.innerHTML = "";
            let sumaTotalAcumulada = 0;

            if (listaServicios.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center" style="color: #999;">No se recibieron materiales en el documento.</td></tr>`;
            } else {
                listaServicios.forEach((servicio, index) => {
                    const tr = document.createElement('tr');
                    
                    const nombre = servicio.trim();
                    const unidad = listaUnidades[index] ? listaUnidades[index].trim() : 'Unidad';
                    const cantidad = listaCantidades[index] ? parseFloat(listaCantidades[index].trim()).toFixed(2) : '0.00';
                    
                    const precioTexto = listaPrecios[index] ? listaPrecios[index].replace(/[^0-9.-]+/g, "") : "0";
                    const costoNumerico = parseFloat(precioTexto) || 0;
                    
                    sumaTotalAcumulada += costoNumerico;
                    
                    // CORRECCIÓN MONEDA: Formato nativo local de Colombia (COP $)
                    const costoFormateado = costoNumerico.toLocaleString('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 2 });

                    tr.innerHTML = `
                        <td>${nombre}</td>
                        <td class="text-center">${unidad}</td>
                        <td class="text-right">${cantidad}</td>
                        <td class="text-right">${costoFormateado}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // CORRECCIÓN TOTAL GENERAL: Formato nativo local de Colombia (COP $)
            document.getElementById('inv-total-general').innerText = sumaTotalAcumulada.toLocaleString('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 2 });

            // Ocultar pantalla de carga y mostrar factura
            document.getElementById('loading').style.display = 'none';
            document.getElementById('invoice').style.display = 'block';

        } catch (e) {
            document.getElementById('loading').innerText = "Error al procesar los datos de la factura: " + e.message;
        }
    }
</script>
</body>
</html>
